# GDAL OSM driver configuration for migration 0028's OpenStreetMap address load
# (ogr2ogr ... data/osm/greater-london-latest.osm.pbf points multipolygons).
# Only the address tags are kept; everything else is dropped.
# OpenStreetMap data is (c) OpenStreetMap contributors, ODbL 1.0.

[general]
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform
attribute_name_laundering=yes

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=building,addr:housenumber,addr:housename,addr:street,addr:postcode,addr:flats,addr:unit
other_tags=no

[lines]
osm_id=yes
attributes=name
other_tags=no

[multipolygons]
osm_id=yes
osm_way_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=building,addr:housenumber,addr:housename,addr:street,addr:postcode,addr:flats,addr:unit
other_tags=no

[multilinestrings]
osm_id=yes
attributes=name
other_tags=no

[other_relations]
osm_id=yes
attributes=name
other_tags=no
