# Shared by the two public GETs in hpldn.conf, /api/areas and /api/inflation
# (installed as /etc/nginx/hpldn/api_cache.conf): the same figures for every
# visitor, changed monthly. nginx keeps the API's answer (zone hpldn_public)
# for as long as its Cache-Control says (s-maxage, stale-while-revalidate;
# api/routers/market.py), and answers from that copy while it fetches a fresh
# one, while the API restarts or warms up, and if the API errors or is slow.
# The rate limits and the ban check still run first.
proxy_cache hpldn_public;
# The path only (after api_proxy.conf's /api strip): a query string the
# client adds cannot make each request a miss.
proxy_cache_key $uri;
proxy_cache_valid 200 5m;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
# Concurrent misses wait for one request to the API, not one each.
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_revalidate on;
