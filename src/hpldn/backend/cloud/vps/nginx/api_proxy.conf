# Shared by the /api locations in hpldn.conf (installed as
# /etc/nginx/hpldn/api_proxy.conf): strip the /api prefix, add the API key
# (overriding anything the client sent) and forward to gunicorn over its unix
# socket (upstream hpldn_api in hpldn.conf).
rewrite ^/api(/.*)$ $1 break;
proxy_pass http://hpldn_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Root-only file holding `proxy_set_header X-API-Key "...";`, written by
# bootstrap.sh from /etc/hpldn/api.env. The key never reaches the browser.
include /etc/nginx/hpldn/api_key.conf;
proxy_set_header Host $host;
# $remote_addr is the visitor's address (real_ip from CF-Connecting-IP).
# api/ratelimit.py trusts X-Real-IP only from its unix socket (or the
# loopback), i.e. from here.
proxy_set_header X-Real-IP $remote_addr;
# Replaced, not appended to: a client-supplied X-Forwarded-For must not
# reach uvicorn's proxy-header handling.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# The call's id ($hpldn_request_id, hpldn.conf), logged by the API.
proxy_set_header X-Request-ID $hpldn_request_id;
# Headers only Cloudflare should set, and nothing the API reads.
proxy_set_header CF-Connecting-IP "";
proxy_set_header Cookie "";
# The read API's own statement_timeout is 5s; give the proxy a little more
# than that so a slow query returns its own error.
proxy_read_timeout 15s;
# The API's reason for a 429 or 403 (rate, captcha) is for the guard log
# ($upstream_http_x_hpldn_reject in hpldn.conf), not for the client.
proxy_hide_header X-HPLDN-Reject;
# The id goes back on every answer, nginx's own refusals included; the API's
# copy is dropped so there is one.
proxy_hide_header X-Request-ID;
# Nothing that names the software behind nginx.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
add_header X-Request-ID $hpldn_request_id always;
# API responses are per-request; Cloudflare must not cache them. The two
# public GETs (api_cache.conf) are the exception: $hpldn_api_cache_control is
# empty for them (hpldn.conf), so no header is added and the API's own
# Cache-Control passes through.
add_header Cache-Control $hpldn_api_cache_control always;
include /etc/nginx/hpldn/security_headers.conf;
