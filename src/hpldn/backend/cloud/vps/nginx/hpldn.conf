# HPLDN public site: the React bundle and the whitelisted /api routes.
#
# Installed as /etc/nginx/conf.d/hpldn.conf by bootstrap.sh, which replaces
# @SERVER_NAME@ with the domain. conf.d is included inside the http block,
# which is where the limit_*_zone and real_ip directives have to live.
#
# A single host behind Cloudflare:
#   * the client address is Cloudflare's CF-Connecting-IP (trusted only from
#     Cloudflare's published ranges, cloudflare_realip.conf), so every
#     limit_req/limit_conn key is the real visitor, not a Cloudflare edge;
#   * only 443 is served; Cloudflare redirects plain HTTP at the edge, and
#     the OCI network security group and the host firewall admit 443 from
#     Cloudflare's ranges only;
#   * the certificate is a Cloudflare Origin CA certificate (ECDSA P-256,
#     made by cloud/oci/main), and Authenticated Origin Pulls are MANDATORY,
#     with our own client CA (not Cloudflare's shared one, which any
#     Cloudflare customer's zone presents): a TLS client that does not hold
#     the leaf certificate this zone's edge presents gets no response;
#   * the API is reached over its unix socket only (hpldn-api.socket).
#
# Every rate limit, timeout and denied user agent comes from guard.yaml,
# rendered into /etc/nginx/hpldn/ by render_guard_nginx.py (bootstrap.sh).
# The hpldn-guard daemon reads the guard log below and bans abusive clients
# through banned.conf, which hpldn-nginx-reload.path reloads nginx for.

# set_real_ip_from <each Cloudflare range>; real_ip_header CF-Connecting-IP;
# Written by hpldn-cloudflare-ips from https://www.cloudflare.com/ips-v4|v6.
include /etc/nginx/hpldn/cloudflare_realip.conf;

server_tokens off;

# gunicorn's socket (hpldn-api.socket: hpldn:www-data 0660). There is no TCP
# listener behind nginx.
upstream hpldn_api {
    server unix:/run/hpldn-api/api.sock;
    keepalive 16;
}

# The two public GETs' copies (api_cache.conf): a few hundred KB at most.
proxy_cache_path /var/cache/nginx/hpldn levels=1:2 keys_zone=hpldn_public:1m max_size=16m inactive=1d use_temp_path=off;

# Cache-Control for /api answers (api_proxy.conf): "no-store", except for the
# two public GETs, whose own Cache-Control from the API passes through (an
# add_header whose value is empty adds nothing).
map $request_uri $hpldn_api_cache_control {
    "~^/api/(areas|inflation)(\?|$)" "";
    default "no-store";
}

# Compression. Ubuntu's nginx.conf turns gzip on for text/html only; the
# bundle and the API's JSON are most of the bytes. /static/ also serves the
# .gz files deploy.sh writes beside each asset (gzip_static).
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;

# Clients banned by hpldn-guard ("<cidr> 1;" lines), and the search crawlers'
# published ranges, which get their own rate-limit zone and are never banned.
# Both files are written by the guard; bootstrap.sh seeds them empty.
geo $hpldn_banned {
    default 0;
    include /var/lib/hpldn-guard/nginx/banned.conf;
}
geo $hpldn_crawler {
    default 0;
    include /var/lib/hpldn-guard/nginx/crawlers.conf;
}

# Per-client limits (limit_req_zone/limit_conn_zone, keyed on the real client
# address; crawlers on their own zone), from guard.yaml rate_limits.nginx.
include /etc/nginx/hpldn/limits_http.conf;
limit_req_status 429;
limit_conn_status 429;

# $hpldn_deny_ua: scripts and scanners by user agent, on /api only.
include /etc/nginx/hpldn/bad_ua.conf;

# One JSON line per request for the hpldn-guard daemon, over its unix socket.
# u is the path as asked for ($uri is rewritten by try_files and the /api
# prefix strip); rj is the API's X-HPLDN-Reject (rate, captcha), hidden from
# the client.
log_format hpldn_guard escape=json '{"t":"$msec","ip":"$remote_addr","m":"$request_method","u":"$request_uri","s":"$status","ua":"$http_user_agent","rj":"$upstream_http_x_hpldn_reject","b":"$hpldn_banned","c":"$hpldn_crawler"}';

# The call's id: the X-Request-ID the page sent when well formed, else
# nginx's own. Passed to the API and echoed back (api_proxy.conf), so the
# browser console's line, the API's log line and the edge line below for one
# call carry the same rid.
map $http_x_request_id $hpldn_request_id {
    "~^[A-Za-z0-9-]{8,64}$" $http_x_request_id;
    default $request_id;
}

# The /api requests nginx answers without the API -- refused (429 rate or
# connection limit, 403 ban, user agent or method), unknown (404), or with
# gunicorn down or too slow (502/503/504) -- which the API never sees and so
# never logs. They are written in the API log's own shape (api/access_log.py),
# to hpldn-api.log on the host and into api.log in the local stack, so that
# log holds every API request.
map "$upstream_status|$request_uri" $hpldn_edge_api {
    default 0;
    "~^\|/api/" 1;
    "~^[^|]*50[234][^|]*\|/api/" 1;
}
map "$hpldn_banned:$status" $hpldn_edge_reason {
    "~^1:" banned;
    "~:429$" rate;
    "~:403$" forbidden;
    "~:404$" no_route;
    "~:50[234]$" upstream;
    default edge;
}
# gunicorn's timestamp format, 2026-10-03 12:16:41 +0100.
map $time_iso8601 $hpldn_log_time {
    "~^(?<hpldn_day>[0-9-]+)T(?<hpldn_clock>[0-9:]+)(?<hpldn_zh>[+-][0-9]{2}):(?<hpldn_zm>[0-9]{2})$" "$hpldn_day $hpldn_clock $hpldn_zh$hpldn_zm";
    default $time_iso8601;
}
# The site's access log: nginx's combined format, then where each request's
# time went (total, connecting to the API, the API's first byte and its whole
# answer), the cache's verdict, the client connection (id, its request count,
# protocol, TLS session reuse) and the call's id. Then Cloudflare's ray (its
# suffix is the data centre that took the request), the request's length and
# its Content-Length/Transfer-Encoding: a GET that names a body Cloudflare
# waits for shows here (it reaches nginx only when the page cancels it, as
# a 499 with rt=0.000).
log_format hpldn_timing '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
                        'cache=$upstream_cache_status conn=$connection reqs=$connection_requests proto=$server_protocol '
                        'tlsreuse=$ssl_session_reused rid=$hpldn_request_id '
                        'cfray=$http_cf_ray reqlen=$request_length cl=$http_content_length te=$http_transfer_encoding';
log_format hpldn_api '[$hpldn_log_time] [nginx] [EDGE] $remote_addr "$request_method $request_uri" $status ${request_time}s rid=$hpldn_request_id reject=$hpldn_edge_reason';

# Any other host name (a scanner that learned the origin address, or a
# request for the bare IP) gets no certificate and no page.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    # `listen ... http2`, not `http2 on;`: Ubuntu 24.04's nginx is 1.24, and
    # the directive arrived in 1.25.1.
    listen 443 ssl http2;
    server_name @SERVER_NAME@;

    # ECDSA P-256, from Cloudflare's Origin CA (cloud/oci/main/cloudflare.tf).
    ssl_certificate     /etc/hpldn/tls/origin.crt;
    ssl_certificate_key /etc/hpldn/tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 1.2: forward-secret ECDHE with AEAD ciphers only (TLS 1.3's suites
    # are all AEAD already).
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_ecdh_curve      X25519:prime256v1;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls, mandatory: Cloudflare's edge presents the
    # client certificate cloud/oci/main issued from our own CA, and that CA is
    # the only one trusted here. Anything else -- a scanner that found the
    # address, another Cloudflare zone -- gets no answer: nginx still
    # completes the handshake and would send a 400 page (496 no certificate,
    # 495 a bad one), so those close the connection instead.
    ssl_client_certificate /etc/hpldn/tls/aop_ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
    error_page 495 496 = @hpldn_no_aop;
    location @hpldn_no_aop {
        return 444;
    }

    include /etc/nginx/hpldn/security_headers.conf;

    # A server-level access_log replaces the http level's, so name both.
    access_log /var/log/nginx/access.log hpldn_timing;
    access_log syslog:server=unix:/run/hpldn-guard/log.sock,nohostname hpldn_guard;
    access_log /var/log/nginx/hpldn-api.log hpldn_api if=$hpldn_edge_api;

    # A banned client gets one short answer for everything, and costs nothing
    # more. Cloudflare blocks it at the edge too once the list syncs.
    if ($hpldn_banned) {
        rewrite ^ /__hpldn_banned last;
    }
    location = /__hpldn_banned {
        internal;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        # A location's own add_header drops the server's, so repeat them.
        include /etc/nginx/hpldn/security_headers.conf;
        return 403 "Access from your network is temporarily restricted because of unusual traffic. It lifts automatically.\n";
    }

    # Scripts and scanners by user agent (guard.yaml user_agents), on /api.
    if ($hpldn_deny_ua) {
        return 403;
    }

    # No route takes more than a small JSON body.
    client_max_body_size 4k;
    # limit_conn per client and the timeouts against slow clients.
    include /etc/nginx/hpldn/server_limits.conf;

    # The browser's data calls. ONLY these routes are proxied: nginx adds
    # the API key, so anything reachable here is effectively public. Each
    # location's limits/<name>.conf is guard.yaml rate_limits.nginx.routes.<name>;
    # all but /areas*, /inflation, /session* and /addresses/search also need
    # the API's reCAPTCHA pass (X-HPLDN-Pass).
    # /properties, /docs, /openapi.json and /addresses/search/metrics stay on
    # the loopback, reachable with the key from the host and nowhere else.
    location = /api/areas {
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/areas.conf;
        include /etc/nginx/hpldn/api_cache.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    # Either case, as the API and the dev proxy accept: /api/areas/sw11 works.
    location ~ ^/api/areas/[A-Za-z0-9]+(/comparables)?$ {
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/area.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    location = /api/estimate {
        limit_except POST { deny all; }
        include /etc/nginx/hpldn/limits/estimate.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    # Model pricing of one home: suggestions for a partial address, the homes
    # at a postcode, then the price.
    location = /api/addresses/search {
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/address_search.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    location = /api/addresses {
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/addresses.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    location = /api/price {
        limit_except POST { deny all; }
        include /etc/nginx/hpldn/limits/price.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    # What the homes nearest a priced home recently sold for.
    location = /api/nearby {
        limit_except POST { deny all; }
        include /etc/nginx/hpldn/limits/nearby.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    # The schools nearest a priced home, with their Ofsted ratings.
    location = /api/schools {
        limit_except POST { deny all; }
        include /etc/nginx/hpldn/limits/schools.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    # UK consumer price inflation, for the price card's detailed analysis.
    location = /api/inflation {
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/inflation.conf;
        include /etc/nginx/hpldn/api_cache.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    # The page's reCAPTCHA v3 check: the site key, then the token traded for
    # the pass the gated routes want. A token is ~2 KB, hence the larger body.
    location = /api/session/config {
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/session_config.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    location = /api/session {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        include /etc/nginx/hpldn/limits/session.conf;
        include /etc/nginx/hpldn/api_proxy.conf;
    }

    # Any other /api path is a 404 here, not the page's index.html.
    location /api/ {
        return 404;
    }

    # The API's own paths are never served at the top level either, not even
    # as the single-page app's index.html, so a probe learns nothing.
    location ~ ^/(docs|redoc|openapi\.json|properties|health|ready)(/|$) {
        return 404;
    }

    # Dotfiles (.git, .env, ...) never exist in the bundle; say so plainly.
    location ~ /\. {
        return 404;
    }

    # Source maps and the build's asset manifest are never shipped (deploy.sh
    # refuses a build holding them); if one ever slipped through, it is still
    # never served.
    location ~* \.map$ {
        return 404;
    }
    location = /asset-manifest.json {
        return 404;
    }

    # The React bundle, with index.html answering for client-side routes
    # (/avm, /terms-and-conditions, /privacy-policy).
    location / {
        root /var/www/hpldn;
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/site.conf;
        try_files $uri $uri/ /index.html;
    }

    # index.html names the current hashed bundle; never let Cloudflare or a
    # browser keep an old one.
    location = /index.html {
        root /var/www/hpldn;
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/index.conf;
        add_header Cache-Control "no-cache";
        # A location's own add_header drops the server's, so repeat them.
        include /etc/nginx/hpldn/security_headers.conf;
    }

    location /static/ {
        root /var/www/hpldn;
        limit_except GET { deny all; }
        include /etc/nginx/hpldn/limits/static.conf;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/hpldn/security_headers.conf;
    }
}
