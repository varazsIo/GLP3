# Response hardening (installed as /etc/nginx/hpldn/security_headers.conf),
# included by the server block and by every location that sets its own
# add_header (which would otherwise drop these). The page loads only its own
# bundle, Google Fonts and Google reCAPTCHA v3 (its script, and the iframe it
# runs the check in); index.html has an inline <style> for the first paint,
# hence 'unsafe-inline' for styles only.
# includeSubDomains, not preload: the preload list is hard to leave.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The page shares no browsing context with another origin, and its resources
# are for itself only. (reCAPTCHA v3 runs in an iframe and needs no popup.)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
