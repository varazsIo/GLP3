# PostgreSQL settings for the single-host HPLDN deployment
# (installed as /etc/postgresql/18/main/conf.d/10-hpldn.conf by bootstrap.sh).
#
# Sizing comes from hpldn.backend.common.tuning.compute_postgres_settings for
# PostgreSQL's share of the host, not the whole of it: the A1.Flex VM has
# 4 OCPU / 24 GB, and the two API workers are capped at 14 GB (MemoryMax in
# hpldn-api.service, ~3.2 GB each in practice). Regenerate with
#
#   python -c "from hpldn.backend.common.tuning import *; print('\n'.join(postgres_conf_lines(
#       compute_postgres_settings(HostResources(vcpus=4, memory_mib=16384), data_volume_gb=200))))"
#
# Values marked "override" differ from that output, for the reason given.

# --- Connections: the unix socket only ----------------------------------
# override: no TCP listener at all. The API connects over
# /var/run/postgresql; nothing off the host can reach the database, whatever
# the firewall or the OCI security list say.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
# override (tuning: 16): 2 gunicorn workers x 2 engines (the async request
# pool and the pricing service's sync pool) x SQLAlchemy's default 5 + 10
# overflow = 60, plus the restore script and an admin session.
max_connections = 70
superuser_reserved_connections = 3
# No role has a password (peer authentication only, pg_hba.conf); kept for
# any that ever gets one.
password_encryption = 'scram-sha-256'
ssl = off
# The hba and ident files bootstrap.sh installs.
ident_file = '/etc/postgresql/18/main/pg_ident.conf'

# --- Memory (tuning.py, 4 vCPU / 16 GB) ---------------------------------
shared_buffers = '4GB'
effective_cache_size = '11468MB'
# override (tuning: 352MB, sized for bulk seeding sessions): a serving
# default. The API role sets its own 16MB (api_role.sql).
work_mem = '32MB'
maintenance_work_mem = '1GB'
autovacuum_work_mem = '512MB'
huge_pages = try

# --- Parallelism (tuning.py) ---------------------------------------------
# override (tuning: 4): one more for pg_prewarm's autoprewarm worker (below),
# which holds its slot for good, and one spare, so parallel queries keep 4.
max_worker_processes = 6
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
parallel_setup_cost = 100
parallel_tuple_cost = 0.01
min_parallel_table_scan_size = '8MB'
min_parallel_index_scan_size = '512kB'

# --- WAL and checkpoints (tuning.py) -------------------------------------
max_wal_size = '8GB'
min_wal_size = '1GB'
wal_buffers = '128MB'
wal_compression = on
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
synchronous_commit = on

# --- Planner (tuning.py; block volume is network SSD) --------------------
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
default_statistics_target = 200

# --- Autovacuum (tuning.py) ----------------------------------------------
autovacuum_max_workers = 2
autovacuum_vacuum_cost_limit = 2000

# --- A warm cache across restarts ------------------------------------------
# override (not in tuning.py): the first visitor after a PostgreSQL restart
# would otherwise wait on disk reads (18 Oct 2026: a cold address search
# passed its 250 ms budget and answered 503). autoprewarm saves the list of
# cached blocks every 5 minutes and reloads them at startup;
# restore_serving_db.sh prewarms a freshly restored schema itself.
shared_preload_libraries = 'pg_prewarm'
pg_prewarm.autoprewarm = on
pg_prewarm.autoprewarm_interval = '300s'

# --- Logging --------------------------------------------------------------
# Slow statements only; the API role's own statement_timeout is 5s.
log_min_duration_statement = '2s'
log_connections = off
log_disconnections = off
log_lock_waits = on
# Never the statements themselves, nor their bind parameters (what a visitor
# typed: addresses, postcodes), not even on an error.
log_statement = 'none'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# --- Integrity --------------------------------------------------------------
# PostgreSQL 18's initdb enables data checksums by default; bootstrap.sh
# checks `SHOW data_checksums` is on (a cluster made without them would need
# pg_checksums --enable while stopped).
