# HPLDN serving host: client authentication
# (installed as /etc/postgresql/18/main/pg_hba.conf by bootstrap.sh; the
# packaged file is kept beside it as pg_hba.conf.dist).
#
# There are no `host` lines because PostgreSQL listens on no TCP address
# (listen_addresses = '' in 10-hpldn.conf). Only two local roles can log in,
# both by peer authentication over the unix socket (the kernel names the
# connecting OS user; no password exists to leak):
#   * postgres, as the OS user postgres (bootstrap.sh, restore_serving_db.sh);
#   * hpldn_api, the read-only API role, as the OS user hpldn only (map
#     hpldn_api in pg_ident.conf), into the serving database only.
# hpldn_owner, which owns the serving data, is NOLOGIN: the restore reaches it
# with SET ROLE from postgres. Anything else over the socket is rejected.

# TYPE  DATABASE      USER       METHOD
local   all           postgres   peer
local   hpldn_serve   hpldn_api  peer map=hpldn_api
local   all           all        reject
