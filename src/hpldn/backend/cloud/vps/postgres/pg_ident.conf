# HPLDN serving host: user name maps for peer authentication
# (installed as /etc/postgresql/18/main/pg_ident.conf by bootstrap.sh).
#
# The OS user hpldn (the API's service user, hpldn-api.service) may log in as
# the database role hpldn_api, and nobody else may: not root, not ubuntu, not
# hpldn-guard.

# MAPNAME     SYSTEM-USERNAME   PG-USERNAME
hpldn_api     hpldn             hpldn_api
