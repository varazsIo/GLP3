# =====================================================================
# Migration inputs manifest: every file the alembic chain reads.
#
# hpldn.backend.migrations.inputs is the only resolver. It turns `key` into
# a path, checks the files are present before a revision runs, and pulls or
# pushes Tier A to the OCI bucket:
#
#     python -m hpldn.backend.migrations.inputs check [--revision 0028] [--hash]
#     python -m hpldn.backend.migrations.inputs paths
#     python -m hpldn.backend.migrations.inputs pull|push
#
# Fields
#   key          the name code passes to inputs.resolve (and the staging.yaml
#                `data:` override key)
#   path         relative to ${HPLDN_DATA_DIR} (default <repo>/data)
#   repo         relative to the repository root, for files tracked in git
#                (instead of path)
#   kind         file, dir, or glob (path is a pattern; resolve returns the
#                directory it matches in and check needs at least one match)
#   contains     dir only: files that must be inside it
#   glob         dir only: a pattern that must match at least one file inside it
#   required_by  revisions that read it; "load-raw" is bare_metal --load-raw
#                (StagingCopy, between 0001 and 0002)
#   tier         A: irreproducible or hand-made, backed up to OCI Object
#                Storage; B: re-fetchable from source_url
#   sha256, size pinned content of a fixed file; check compares size, and
#                check --hash compares sha256
#   source_url, licence, fetch (the command that produces it)
#
# A staging.yaml `data: {<key>: <path>}` entry overrides `path` on one host.
# =====================================================================
